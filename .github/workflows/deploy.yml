name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove non-public files
        # Pages の deploy は .assetsignore を見ないので、配信しないファイルはここで消す
        run: rm -rf ./*.md .claude .github .gitignore .assetsignore wrangler.jsonc .wrangler
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.85.0"
          command: pages deploy . --project-name=ninja-yukkuri-typing --branch=main --commit-dirty=true

      # Bing に「更新したよ」と伝える（IndexNow）。このサイトは流入の7割が Bing。
      # 鍵は公開前提のもの（誰でも見られるファイルとして置いている）。秘密ではない。
      # Google は IndexNow を使わないので、そちらは sitemap のまま。
      # ページを足したら urlList と sitemap.xml の両方に入れる。
      - name: Bing に更新を知らせる（IndexNow）
        continue-on-error: true   # 通知に失敗しても公開自体は成功扱いにする
        run: |
          curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json; charset=utf-8" \
            -d '{
              "host": "yukkuri-typing.kkpwebninja.com",
              "key": "646dcacc821cbe2aa6cf10361d940ea9",
              "keyLocation": "https://yukkuri-typing.kkpwebninja.com/646dcacc821cbe2aa6cf10361d940ea9.txt",
              "urlList": [
                "https://yukkuri-typing.kkpwebninja.com/",
                "https://yukkuri-typing.kkpwebninja.com/romaji/",
                "https://yukkuri-typing.kkpwebninja.com/60dai/",
                "https://yukkuri-typing.kkpwebninja.com/kotsu/",
                "https://yukkuri-typing.kkpwebninja.com/home-position/",
                "https://yukkuri-typing.kkpwebninja.com/nou/"
              ]
            }' -w "\nHTTP %{http_code}\n"
